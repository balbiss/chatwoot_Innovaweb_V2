version: '3.8'

services:
  chatwoot_web:
    image: ghcr.io/balbiss/chatwoot_innovaweb_v2:latest
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    environment:
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - FRONTEND_URL=${FRONTEND_URL}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@chatwoot_db:5432/chatwoot_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@chatwoot_redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
      - ENABLE_ACCOUNT_SIGNUP=false
      - FORCE_SSL=false
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL}
      - SMTP_ADDRESS=${SMTP_ADDRESS}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_AUTHENTICATION=plain
      - SMTP_ENABLE_STARTTLS_AUTO=true
      - BAILEYS_PROVIDER_DEFAULT_URL=${BAILEYS_PROVIDER_DEFAULT_URL}
      - BAILEYS_PROVIDER_DEFAULT_API_KEY=${BAILEYS_PROVIDER_DEFAULT_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
    depends_on:
      - chatwoot_db
      - chatwoot_redis
    networks:
      - chatwoot_net
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.http.routers.chatwoot.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.chatwoot.entrypoints=websecure"
        - "traefik.http.routers.chatwoot.tls.certresolver=letsencrypt"
        - "traefik.http.services.chatwoot.loadbalancer.server.port=3000"
    volumes:
      - chatwoot_storage:/app/storage
      - chatwoot_public:/app/public/packs

  chatwoot_sidekiq:
    image: ghcr.io/balbiss/chatwoot_innovaweb_v2:latest
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - FRONTEND_URL=${FRONTEND_URL}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@chatwoot_db:5432/chatwoot_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@chatwoot_redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - BAILEYS_PROVIDER_DEFAULT_URL=${BAILEYS_PROVIDER_DEFAULT_URL}
      - BAILEYS_PROVIDER_DEFAULT_API_KEY=${BAILEYS_PROVIDER_DEFAULT_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
    depends_on:
      - chatwoot_db
      - chatwoot_redis
    networks:
      - chatwoot_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    volumes:
      - chatwoot_storage:/app/storage

  chatwoot_db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - chatwoot_db_data:/var/lib/postgresql/data
    networks:
      - chatwoot_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  chatwoot_redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - chatwoot_redis_data:/data
    networks:
      - chatwoot_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  chatwoot_baileys:
    image: ghcr.io/fazer-ai/baileys-api:latest
    environment:
      - API_KEY=${BAILEYS_PROVIDER_DEFAULT_API_KEY}
    volumes:
      - chatwoot_baileys_data:/app/sessions
    networks:
      - chatwoot_net
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.http.routers.chatwoot-baileys.rule=Host(`${BAILEYS_DOMAIN}`)"
        - "traefik.http.routers.chatwoot-baileys.entrypoints=websecure"
        - "traefik.http.routers.chatwoot-baileys.tls.certresolver=letsencrypt"
        - "traefik.http.services.chatwoot-baileys.loadbalancer.server.port=3000"

networks:
  chatwoot_net:
    driver: overlay
    attachable: true
  traefik-public:
    external: true

volumes:
  chatwoot_db_data:
  chatwoot_redis_data:
  chatwoot_storage:
  chatwoot_public:
  chatwoot_baileys_data:
